networks:
  kyc-net:
    name: kyc-net

volumes:
  fabric-peer-data:
  fabric-orderer-data:
  ipfs-data:
  postgres-data:
  bank-postgres-data:
  couchdb-data:
  tails-data:
  elasticsearch-data:

services:

  # ── Hyperledger Fabric ─────────────────────────────────────────────────────

  fabric-ca:
    image: hyperledger/fabric-ca:1.5.12
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca.org1.example.com
      - FABRIC_CA_SERVER_TLS_ENABLED=false
      - FABRIC_CA_SERVER_PORT=7054
    ports:
      - "7054:7054"
    volumes:
      - ./fabric/crypto-config/peerOrganizations/org1.example.com/ca:/etc/hyperledger/fabric-ca-server
    networks:
      - kyc-net

  orderer.example.com:
    image: hyperledger/fabric-orderer:2.5.9
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    ports:
      - "7050:7050"
    volumes:
      - ./fabric/channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block
      - ./fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./fabric/crypto-config/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - fabric-orderer-data:/var/hyperledger/production/orderer
    networks:
      - kyc-net

  peer0.org1.example.com:
    image: hyperledger/fabric-peer:2.5.9
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=kyc-net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=${COUCHDB_USER:-admin}
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "7051:7051"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp:/etc/hyperledger/fabric/msp
      - ./fabric/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls:/etc/hyperledger/fabric/tls
      - fabric-peer-data:/var/hyperledger/production
    depends_on:
      - orderer.example.com
      - couchdb
    networks:
      - kyc-net

  couchdb:
    image: couchdb:3.3.3
    environment:
      - COUCHDB_USER=${COUCHDB_USER:-admin}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    ports:
      - "127.0.0.1:5984:5984"
    volumes:
      - couchdb-data:/opt/couchdb/data
    networks:
      - kyc-net

  # Admin CLI container: runs peer lifecycle / channel commands with the
  # Admin@org1 MSP mounted. Kept alive with `tail -f /dev/null` so that
  # network.sh and deploy-chaincode.sh can `docker exec fabric-cli peer ...`.
  fabric-cli:
    image: hyperledger/fabric-tools:2.5.9
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.example.com:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_ROOTCERT_FILE=/crypto-config/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
      - CORE_PEER_MSPCONFIGPATH=/crypto-config/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: /bin/bash -c "tail -f /dev/null"
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./fabric/crypto-config:/crypto-config
      - ./fabric/channel-artifacts:/channel-artifacts
      - ./chaincode:/chaincode
    depends_on:
      - peer0.org1.example.com
    networks:
      - kyc-net

  # ── KYC Chaincode Service (CaaS) ──────────────────────────────────────────
  kyccc-service:
    build:
      context: ./chaincode
      dockerfile: Dockerfile
    image: kyc2-system-kyccc
    restart: on-failure
    environment:
      - CHAINCODE_SERVER_ADDRESS=0.0.0.0:7052
      - CORE_CHAINCODE_ID_NAME=${KYCCC_ID:-kyccc_1.0}
    networks:
      - kyc-net

  # ── Hyperledger Indy / ACA-Py ──────────────────────────────────────────────
  # Note: indy-node runs as a remote test ledger (BCovrin).
  # For a fully local setup, replace with https://github.com/bcgov/von-network.

  postgres:
    image: postgres:15.10-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-acapy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-acapypw}
      - POSTGRES_DB=${POSTGRES_DB:-acapy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - kyc-net

  acapy-agent:
    image: ghcr.io/hyperledger/aries-cloudagent-python:py3.12-1.0.0
    # Wrapper script fetches ACAPY_WALLET_KEY + POSTGRES_PASSWORD from Vault,
    # then exec's aca-py. No sensitive values appear in this compose file.
    entrypoint: ["/scripts/acapy-start.sh"]
    command: []
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - ACAPY_ENDPOINT=${ACAPY_ENDPOINT:-http://localhost:8030}
      - INDY_GENESIS_URL=${INDY_GENESIS_URL:-http://test.bcovrin.vonx.io/genesis}
      - ACAPY_TAILS_SERVER_BASE_URL=${ACAPY_TAILS_SERVER_BASE_URL:-http://tails-server:6543}
    ports:
      - "8030:8030"
      - "127.0.0.1:8031:8031"
    depends_on:
      postgres:
        condition: service_started
      tails-server:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - kyc-net

  # ── Bank Verifier (ACA-Py) ────────────────────────────────────────────────
  # Separate ACA-Py agent acting as a Verifier (bank role).
  # Sends DIDComm proof requests to user wallets and verifies KYC credentials
  # directly against the Indy ledger — no contact with the KYC backend needed.

  bank-postgres:
    image: postgres:15.10-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-acapy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-acapypw}
      - POSTGRES_DB=bank-acapy
    volumes:
      - bank-postgres-data:/var/lib/postgresql/data
    networks:
      - kyc-net

  bank-acapy:
    image: ghcr.io/hyperledger/aries-cloudagent-python:py3.12-1.0.0
    entrypoint: ["/scripts/bank-acapy-start.sh"]
    command: []
    environment:
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - ACAPY_ENDPOINT=${BANK_ACAPY_ENDPOINT:-http://localhost:8040}
      - INDY_GENESIS_URL=${INDY_GENESIS_URL:-http://test.bcovrin.vonx.io/genesis}
      - ACAPY_TAILS_SERVER_BASE_URL=${ACAPY_TAILS_SERVER_BASE_URL:-http://tails-server:6543}
    ports:
      - "8040:8040"
      - "127.0.0.1:8041:8041"
    depends_on:
      bank-postgres:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - kyc-net

  # ── IPFS ───────────────────────────────────────────────────────────────────

  ipfs:
    image: ipfs/kubo:v0.26.0
    environment:
      - IPFS_PROFILE=server
    ports:
      - "4001:4001"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:8080:8080"
    volumes:
      - ipfs-data:/data/ipfs
    networks:
      - kyc-net

  # ── Indy Tails Server ─────────────────────────────────────────────────────

  tails-server:
    image: ghcr.io/bcgov/tails-server:1.0.0
    user: root
    entrypoint: ["sh", "-c", "chmod 777 /tails-files && tails-server --host 0.0.0.0 --port 6543 --storage-path /tails-files --log-level INFO"]
    environment:
      - TAILS_FILES_DIR=/tails-files
      - GENESIS_URL=${INDY_GENESIS_URL:-http://test.bcovrin.vonx.io/genesis}
    ports:
      - "127.0.0.1:6543:6543"
    volumes:
      - tails-data:/tails-files
    networks:
      - kyc-net

  # ── HashiCorp Vault ────────────────────────────────────────────────────────

  vault:
    image: hashicorp/vault:1.17.6
    command: server -dev -dev-root-token-id=${VAULT_TOKEN:-root}
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=${VAULT_TOKEN:-root}
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    ports:
      - "127.0.0.1:8200:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - kyc-net
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 5s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:1.17.6
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      # Secrets read from .env on first run to seed Vault KV.
      # After this container runs, services fetch secrets from Vault directly.
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY}
      - ACAPY_WALLET_KEY=${ACAPY_WALLET_KEY}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-acapypw}
      - POSTGRES_USER=${POSTGRES_USER:-acapy}
      - VERIFIER_PASSWORD=${VERIFIER_PASSWORD}
      - USER_PASSWORD=${USER_PASSWORD}
      - BANK_PASSWORD=${BANK_PASSWORD}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD:-adminpw}
    command:
      - sh
      - -c
      - |
        vault secrets enable transit 2>/dev/null || true &&
        vault secrets enable -path=secret kv-v2 2>/dev/null || true &&
        vault kv put secret/kyc \
          jwt_secret="$$JWT_SECRET" \
          encryption_master_key="$$ENCRYPTION_MASTER_KEY" \
          acapy_wallet_key="$$ACAPY_WALLET_KEY" \
          postgres_password="$$POSTGRES_PASSWORD" \
          postgres_user="$$POSTGRES_USER" \
          verifier_password="$$VERIFIER_PASSWORD" \
          user_password="$$USER_PASSWORD" \
          bank_password="$$BANK_PASSWORD" \
          couchdb_password="$$COUCHDB_PASSWORD" &&
        echo 'Vault: Transit engine + KV secrets initialized'
    networks:
      - kyc-net

  # ── Application ────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${BACKEND_PORT:-3000}
      - FABRIC_CHANNEL=${FABRIC_CHANNEL:-kycchannel}
      - FABRIC_CHAINCODE=${FABRIC_CHAINCODE:-kyccc}
      - FABRIC_MSP_ID=${FABRIC_MSP_ID:-Org1MSP}
      - FABRIC_CRYPTO_CONFIG_PATH=/app/crypto-config
      - ACAPY_ADMIN_URL=http://acapy-agent:8031
      - IPFS_API_URL=http://ipfs:5001
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-root}
      - VAULT_ENABLED=${VAULT_ENABLED:-true}
      - BANK_ACAPY_ADMIN_URL=${BANK_ACAPY_ADMIN_URL:-http://bank-acapy:8041}
      - KYC_CRED_DEF_ID=${KYC_CRED_DEF_ID:-}
      # Non-secret config only — sensitive values fetched from Vault KV at startup.
      - VERIFIER_USERNAME=${VERIFIER_USERNAME:-verifier}
      - USER_USERNAME=${USER_USERNAME:-user}
      - BANK_USERNAME=${BANK_USERNAME:-bank}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      peer0.org1.example.com:
        condition: service_started
      acapy-agent:
        condition: service_started
      ipfs:
        condition: service_started
      vault-init:
        condition: service_completed_successfully
    volumes:
      - ./fabric/crypto-config:/app/crypto-config:ro
    networks:
      - kyc-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3000}
        - REACT_APP_CRED_DEF_ID=${REACT_APP_CRED_DEF_ID:-}
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - kyc-net

  bank-frontend:
    build:
      context: ./bank-frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:3000}
    ports:
      - "${BANK_FRONTEND_PORT:-3002}:80"
    depends_on:
      - backend
    networks:
      - kyc-net

  # ── Logging: ELK Stack ─────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - kyc-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v '\"status\":\"red\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kyc-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    user: root
    command: filebeat -e --strict.perms=false
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - kyc-net
