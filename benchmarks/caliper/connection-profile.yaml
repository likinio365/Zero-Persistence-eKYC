name: kyc-network
version: "1.0"
client:
  organization: Org1MSP
  connection:
    timeout:
      peer:
        endorser: 300

channels:
  kycchannel:
    peers:
      peer0.org1.example.com: {}

organizations:
  Org1MSP:
    mspid: Org1MSP
    peers:
      - peer0.org1.example.com
    certificateAuthorities:
      - ca.org1.example.com

peers:
  peer0.org1.example.com:
    url: grpcs://localhost:7051
    tlsCACerts:
      path: ../../fabric/crypto-config/peerOrganizations/org1.example.com/tlsca/tlsca.org1.example.com-cert.pem
    grpcOptions:
      ssl-target-name-override: peer0.org1.example.com
      hostnameOverride: peer0.org1.example.com

certificateAuthorities:
  ca.org1.example.com:
    url: http://localhost:7054
    caName: ca.org1.example.com
